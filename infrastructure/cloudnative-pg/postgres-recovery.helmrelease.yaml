apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-recovery
  namespace: cnpg-system
spec:
  suspend: true
  dependsOn:
    - name: plugin-barman-cloud
      namespace: cnpg-system
  interval: 30m
  timeout: 30m
  releaseName: postgres-recovery
  targetNamespace: default
  chart:
    spec:
      chart: cluster
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: postgres-recovery
    mode: recovery
    version:
      postgresql: "18"
    recovery:
      method: plugin
      clusterName: postgres
      database: ""
      owner: ""
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres-backups
      objectStore:
        create: false
      secret:
        create: false
        name: s3-creds
    backups:
      enabled: false
    cluster:
      instances: 3
      imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
      storage:
        storageClass: longhorn-cnpg
        size: 40Gi
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      affinity:
        enablePodAntiAffinity: true
        topologyKey: kubernetes.io/hostname
        podAntiAffinityType: required
      certificates:
        serverAltDNSNames:
          - postgres-recovery-external.default.svc.cluster.local
