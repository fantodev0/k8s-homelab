apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: default
  annotations:
    # Preserve all manually managed Cluster fields outside this narrow patch.
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  # The vcluster CNPG admission webhook validates the Flux SSA payload before
  # merging it with the live Cluster, so it requires this existing field.
  # Keep it equal to the manually managed Cluster's current storage size.
  storage:
    size: 40Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
