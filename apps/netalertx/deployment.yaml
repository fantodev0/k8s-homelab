apiVersion: apps/v1
kind: Deployment
metadata:
  name: netalertx
  namespace: netalertx
  labels:
    app: netalertx
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: netalertx

  template:
    metadata:
      labels:
        app: netalertx

    spec:
      hostNetwork: false

      # initContainers:
      #   - name: initialize-data-directory
      #     image: busybox:1.37
      #     command:
      #       - sh
      #       - -ec
      #       - |
      #         mkdir -p /data/config /data/db
      #         chown -R 20211:20211 /data
      #     volumeMounts:
      #       - name: data
      #         mountPath: /data

      containers:
        - name: netalertx
          image: jokobsk/netalertx:26

          envFrom:
            - configMapRef:
                name: netalertx

          env:
            - name: SYNC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netalertx
                  key: SYNC_API_TOKEN

            - name: SYNC_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netalertx
                  key: SYNC_ENCRYPTION_KEY

            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: netalertx
                  key: DISCORD_WEBHOOK_URL

            - name: APP_CONF_OVERRIDE
              value: >-
                {
                  "TIMEZONE":"Europe/Berlin",
                  "API_TOKEN":"$(SYNC_API_TOKEN)",
                  "SYNC_encryption_key":"$(SYNC_ENCRYPTION_KEY)",

                  "SYNC_RUN":"schedule",
                  "SYNC_RUN_SCHD":"* * * * *",
                  "SYNC_BEHAVIOR":"copy-new",
                  "SYNC_nodes":[
                    "http://192.168.31.230:20212",
                    "http://192.168.50.230:20212",
                    "http://192.168.88.230:20212",
                    "http://192.168.99.230:20212"
                  ],

                  "ARPSCAN_RUN":"disabled",
                  "AVAHISCAN_RUN":"disabled",
                  "NBTSCAN_RUN":"disabled",
                  "NSLOOKUP_RUN":"disabled",
                  "DIGSCAN_RUN":"disabled",
                  "INTRNT_RUN":"disabled",

                  "WEBHOOK_RUN":"on_notification",
                  "WEBHOOK_URL":"$(DISCORD_WEBHOOK_URL)",
                  "WEBHOOK_PAYLOAD":"text",
                  "WEBHOOK_REQUEST_METHOD":"POST",
                  "NTFPRCS_INCLUDED_SECTIONS":"['new_devices']",
                  "NTFPRCS_TEXT_TEMPLATE_new_devices":"🆕 {devName} | {eveIp} | {eveMac} | {devVendor}"

                }

          ports:
            - name: http
              containerPort: 20211
              protocol: TCP

            - name: graphql
              containerPort: 20212
              protocol: TCP

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi

          volumeMounts:
            - name: data
              mountPath: /data

            - name: tmp
              mountPath: /tmp

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netalertx

        - name: tmp
          emptyDir:
            medium: Memory
