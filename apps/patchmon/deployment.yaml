apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: patchmon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: fix-permissions
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - |
              mkdir -p /data/agents /data/assets
              chown -R 1000:1000 /data
              chmod -R 775 /data
          volumeMounts:
            - name: patchmon-files
              mountPath: /data
      containers:
        - name: backend
          image: ghcr.io/patchmon/patchmon-backend@sha256:e44e310bf3e4647ae67c7a8a45c60c350fe7954df2809ba2842edf8cb56e9b07
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: patchmon-config
            - secretRef:
                name: patchmon-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: patchmon-files
              mountPath: /app/agents
              subPath: agents
            - name: patchmon-files
              mountPath: /app/assets
              subPath: assets

      volumes:
        - name: patchmon-files
          persistentVolumeClaim:
            claimName: patchmon-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: patchmon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/patchmon/patchmon-frontend@sha256:002c9c9c1fe36961b0cf45a4b6723a6dafe97fa24ea4e39bd2fcc6b9ab73b71d
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: patchmon-config-frontend
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: patchmon-files
              mountPath: /usr/share/nginx/html/assets

      volumes:
        - name: patchmon-files
          persistentVolumeClaim:
            claimName: patchmon-frontend
---
