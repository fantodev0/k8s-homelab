apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: patchmon
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: patchmon
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-loadbalancer
  namespace: patchmon
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.88.102
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
