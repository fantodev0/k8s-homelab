apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  suspend: false
  interval: 30m
  timeout: 15m
  releaseName: open-webui
  targetNamespace: open-webui
  chart:
    spec:
      chart: open-webui
      version: 18.0.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: open-webui
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: open-webui
    image:
      tag: v0.13.2
      pullPolicy: IfNotPresent

    ollama:
      enabled: false
    pipelines:
      enabled: false
    tika:
      enabled: false
    terminals:
      enabled: false

    # openaiBaseApiUrls:
    #   - http://ollama.<namespace>.svc.cluster.local:11434/v1
    enableOpenaiApi: true

    extraEnvVars:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: open-webui-secrets
            key: database-url
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: open-webui-secrets
            key: webui-secret-key
      - name: CORS_ALLOW_ORIGIN
        valueFrom:
          secretKeyRef:
            name: open-webui-secrets
            key: cors-allow-origin

    websocket:
      enabled: true
      manager: redis
      existingSecret: open-webui-secrets
      existingSecretKey: redis-url
      redis:
        enabled: false

    replicaCount: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce

    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: false
    route:
      enabled: false

    livenessProbe:
      httpGet:
        path: /health
        port: http
      failureThreshold: 3
      periodSeconds: 15
    readinessProbe:
      httpGet:
        path: /health/db
        port: http
      failureThreshold: 3
      periodSeconds: 10
    startupProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 60

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
