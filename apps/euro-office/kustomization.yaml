apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: euro
resources:
  - httproute.yaml
  - service.yaml
  - slice.yaml
  - ../base

patches:
  - target:
      group: traefik.io
      version: v1alpha1
      kind: Middleware
      name: default-headers
    patch: |-
      - op: replace
        path: /spec/headers/frameDeny
        value: false
