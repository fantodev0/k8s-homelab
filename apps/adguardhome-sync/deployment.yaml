apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-sync-vlan31
  labels:
    app: adguard-sync
    vlan: "31"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguard-sync
      vlan: "31"
  template:
    metadata:
      labels:
        app: adguard-sync
        vlan: "31"
    spec:
      containers:
        - name: sync
          image: ghcr.io/bakito/adguardhome-sync@sha256:157e509baeef66cd400dae96c955a1e97312670e0285a92ebe2c3465b3e22e67
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config/adguardhome-sync.yaml
              subPath: vlan31.yaml
      volumes:
        - name: config
          configMap:
            name: adguard-sync-configs
